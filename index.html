<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byejack 小禮物</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-glow {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 15px rgba(249, 115, 22, 0.8), 0 0 30px rgba(249, 115, 22, 0.4);
            }
            50% {
                transform: scale(1.15);
                box-shadow: 0 0 25px rgba(249, 115, 22, 1), 0 0 50px rgba(249, 115, 22, 0.7);
            }
        }
        .hotspot-glow {
            animation: pulse-glow 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-[#0c0a09] text-amber-50 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-amber-500 selection:text-black">

    <!-- 頂部提示文字 -->
    <header class="mb-6 text-center">
        <h1 class="text-xl sm:text-2xl md:text-3xl font-black tracking-wider text-amber-400 drop-shadow-[0_2px_10px_rgba(245,158,11,0.4)]">
            按下Byejack老師的手指即可獲得小禮物
        </h1>
    </header>

    <!-- 圖片主體與熱區容器 -->
    <main class="relative inline-block max-w-md w-full rounded-2xl overflow-hidden shadow-[0_0_50px_rgba(194,65,12,0.3)] border-2 border-amber-600/40 bg-black">
        <!-- 透過遠端/Base64引入，確保打開絕對看得到圖 -->
        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=800&auto=format&fit=crop" id="bj-img" alt="Byejack" class="w-full h-auto block select-none pointer-events-none" style="display:none;">
        
        <!-- 這裡我們使用你提供的圖片作為背景直接渲染，或用 Canvas 確保 100% 顯示 -->
        <div id="image-container" class="w-full flex justify-center bg-black">
            <!-- 確保你的 bj.jpg 存在同資料夾，若要更簡單，直接用下面這行 -->
        </div>

        <script>
            // 自動帶入你上傳的圖片畫面的 Base64 或本地路徑備援
            const imgElement = document.createElement('img');
            imgElement.src = 'bj.jpg';
            imgElement.className = 'w-full h-auto block select-none pointer-events-none';
            imgElement.onerror = function() {
                // 如果同資料夾找不到 bj.jpg，自動改用替代預覽防破圖
                this.src = 'data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22400%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23111%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23f59e0b%22 font-family=%22sans-serif%22 font-size=%2216%22%3E請將 bj.jpg 與網頁放在同資料夾%3C/text%3E%3C/svg%3E';
            };
            document.getElementById('image-container').appendChild(imgElement);
        </script>

        <!-- 食指點擊熱區 (定位在食指位置) -->
        <a href="https://youtu.be/2JQNP-cwZUI?si=pmZysyaMgz1NMDS5" 
           target="_blank" 
           rel="noopener noreferrer"
           title="按下獲得小禮物"
           class="absolute z-10 block rounded-full hotspot-glow cursor-pointer transition-transform hover:scale-125"
           style="top: 45.5%; left: 33.2%; width: 42px; height: 42px; background: radial-gradient(circle, rgba(251,191,36,0.9) 0%, rgba(234,88,12,0.6) 60%, rgba(0,0,0,0) 100%);">
            
            <span class="absolute inset-2 bg-amber-300 rounded-full opacity-80 animate-ping"></span>
        </a>
    </main>

    <footer class="mt-6 text-xs text-amber-200/50 tracking-widest uppercase">
        Byejack Official Event
    </footer>

</body>
</html>
