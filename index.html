<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>哆啦A夢的小禮物</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #7dd3fc 100%);
    }

    /* 哆啦A夢頭部設計 */
    .doraemon-head {
      width: 320px;
      height: 320px;
      background: #00a0e9;
      border: 5px solid #1e293b;
      border-radius: 50%;
      position: relative;
      box-shadow: 0 20px 35px -10px rgba(0, 160, 233, 0.4), inset 0 -10px 20px rgba(0, 0, 0, 0.15);
      margin: 0 auto;
    }

    /* 白色臉龐 */
    .doraemon-face {
      width: 270px;
      height: 230px;
      background: #ffffff;
      border: 4px solid #1e293b;
      border-radius: 50% 50% 45% 45% / 55% 55% 45% 45%;
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* 雙眼 */
    .eye {
      width: 62px;
      height: 76px;
      background: #ffffff;
      border: 4px solid #1e293b;
      border-radius: 50%;
      position: absolute;
      top: -38px;
      z-index: 10;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .eye.left { left: 72px; }
    .eye.right { right: 72px; }

    /* 瞳孔與高光 */
    .pupil {
      width: 18px;
      height: 24px;
      background: #1e293b;
      border-radius: 50%;
      position: absolute;
      bottom: 16px;
    }

    .eye.left .pupil { right: 12px; }
    .eye.right .pupil { left: 12px; }

    .pupil-glare {
      width: 6px;
      height: 8px;
      background: #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 4px;
      right: 3px;
    }

    /* 精緻紅鼻子（超連結點擊直接跳轉） */
    .nose {
      width: 44px;
      height: 44px;
      background: radial-gradient(circle at 35% 35%, #ff5252, #e60012 60%, #990000 100%);
      border: 4px solid #1e293b;
      border-radius: 50%;
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(230, 0, 18, 0.4);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: nosePulse 2s infinite ease-in-out;
      display: block;
      text-decoration: none;
    }

    .nose-glare {
      width: 12px;
      height: 12px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      position: absolute;
      top: 6px;
      left: 8px;
    }

    .nose:hover {
      transform: translateX(-50%) scale(1.22);
      box-shadow: 0 0 25px rgba(230, 0, 18, 0.85), 0 8px 15px rgba(0,0,0,0.2);
    }

    .nose:active {
      transform: translateX(-50%) scale(0.92);
    }

    @keyframes nosePulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(230, 0, 18, 0.5); }
      50% { box-shadow: 0 0 0 14px rgba(230, 0, 18, 0); }
    }

    /* 鼻子下方人中直線 */
    .nose-line {
      width: 4px;
      height: 75px;
      background: #1e293b;
      position: absolute;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
    }

    /* 嘴巴微笑弧線 */
    .mouth {
      width: 200px;
      height: 95px;
      border-bottom: 4px solid #1e293b;
      border-radius: 0 0 100px 100px;
      position: absolute;
      top: 44px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
    }

    /* 白色鬍鬚 */
    .whisker {
      height: 3.5px;
      background: #1e293b;
      position: absolute;
      border-radius: 2px;
      z-index: 6;
    }

    .whisker.left-top { width: 60px; left: 10px; top: 52px; transform: rotate(10deg); }
    .whisker.left-middle { width: 62px; left: 8px; top: 72px; transform: rotate(0deg); }
    .whisker.left-bottom { width: 60px; left: 10px; top: 92px; transform: rotate(-10deg); }

    .whisker.right-top { width: 60px; right: 10px; top: 52px; transform: rotate(-10deg); }
    .whisker.right-middle { width: 62px; right: 8px; top: 72px; transform: rotate(0deg); }
    .whisker.right-bottom { width: 60px; right: 10px; top: 92px; transform: rotate(10deg); }

    /* 紅色領巾與黃金鈴鐺 */
    .collar-container {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .collar {
      width: 230px;
      height: 22px;
      background: #e60012;
      border: 4px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
    }

    .bell {
      width: 42px;
      height: 42px;
      background: radial-gradient(circle at 35% 35%, #fff176, #fbc02d 70%, #f57f17 100%);
      border: 3.5px solid #1e293b;
      border-radius: 50%;
      position: relative;
      margin-top: -12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .bell-line-1 {
      width: 100%;
      height: 3px;
      background: #1e293b;
      position: absolute;
      top: 12px;
    }

    .bell-hole {
      width: 10px;
      height: 10px;
      background: #1e293b;
      border-radius: 50%;
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
    }

    .bell-line-2 {
      width: 3px;
      height: 10px;
      background: #1e293b;
      position: absolute;
      top: 26px;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <!-- 主體互動卡片 -->
  <div class="bg-white/90 backdrop-blur-md p-8 md:p-10 rounded-3xl shadow-2xl max-w-lg w-full text-center border border-white/50">
    
    <div class="mb-6">
      <span class="inline-block bg-sky-100 text-sky-800 font-bold text-xs px-3 py-1.5 rounded-full uppercase tracking-wider mb-2">
        🎁 互動小驚喜
      </span>
      <h1 class="text-2xl md:text-3xl font-extrabold text-slate-800 tracking-tight">
        按下鼻子馬上送你一份小禮物
      </h1>
      <p class="text-slate-600 mt-2 text-sm md:text-base">
        快點擊哆啦A夢的 <span class="text-red-500 font-bold">紅色鼻子</span> 吧！
      </p>
    </div>

    <!-- 精緻還原的哆啦A夢畫布 -->
    <div class="py-6 my-2 relative select-none">
      <div class="doraemon-head">
        <div class="doraemon-face">
          <!-- 雙眼與高光 -->
          <div class="eye left">
            <div class="pupil"><div class="pupil-glare"></div></div>
          </div>
          <div class="eye right">
            <div class="pupil"><div class="pupil-glare"></div></div>
          </div>

          <!-- 關鍵：點擊紅鼻子直接跳轉 YouTube (指定 1分36秒 = 96秒) -->
          <a href="https://youtu.be/jzYuhnJfCl8?si=vSxhxYHfOrTMfaaG&t=96" target="_blank" rel="noopener noreferrer" class="nose" title="領取你的小禮物！">
            <div class="nose-glare"></div>
          </a>

          <!-- 人中線與嘴巴 -->
          <div class="nose-line"></div>
          <div class="mouth"></div>

          <!-- 六根鬍鬚 -->
          <div class="whisker left-top"></div>
          <div class="whisker left-middle"></div>
          <div class="whisker left-bottom"></div>
          <div class="whisker right-top"></div>
          <div class="whisker right-middle"></div>
          <div class="whisker right-bottom"></div>
        </div>

        <!-- 紅領巾與黃金鈴鐺 -->
        <div class="collar-container">
          <div class="collar"></div>
          <div class="bell">
            <div class="bell-line-1"></div>
            <div class="bell-hole"></div>
            <div class="bell-line-2"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部輔助按鈕 -->
    <div class="mt-8">
      <a href="https://youtu.be/jzYuhnJfCl8?si=vSxhxYHfOrTMfaaG&t=96" target="_blank" rel="noopener noreferrer" class="w-full bg-red-500 hover:bg-red-600 active:scale-95 text-white font-bold py-3 px-6 rounded-2xl shadow-lg shadow-red-500/30 transition duration-200 flex items-center justify-center gap-2">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        直接領取小禮物
      </a>
    </div>

  </div>

</body>
</html>
